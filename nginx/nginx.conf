worker_processes auto;

events {
    worker_connections 1024;
}

http {

    # Frontend load balancer 
    upstream frontend_servers {
        least_conn;
        server ai_expense_tracker_app-frontend-1:3000;
        server ai_expense_tracker_app-frontend-2:3000;
    }

    # Backend load balancer 
    upstream backend_servers {
        least_conn;
        server ai_expense_tracker_app-backend-1:5000;
        server ai_expense_tracker_app-backend-2:5000;
    }
    
    # Main server(This is what the browser hits)
    server {
        listen 80;

        # API returns go to Node.js backend
        location /api/ {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Everything else goes to Next.js frontend
        location / {
            proxy_pass http://frontend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }
    }
}