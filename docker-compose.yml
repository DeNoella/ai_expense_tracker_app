
services:

  # PostgreSQL Database (unchanged)
  postgres:
    image: postgres:15-alpine
    container_name: ai_expense_tracker_app-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: finwise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend instance 1
  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_expense_tracker_app-backend-1
    environment:
      PORT: 5000
      FRONTEND_URL: http://localhost
      DB_USER: postgres
      DB_HOST: postgres
      DB_NAME: finwise
      DB_PASSWORD: 123
      DB_PORT: 5432
      JWT_SECRET: your-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped

  # Backend instance 2
  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_expense_tracker_app-backend-2
    environment:
      PORT: 5000
      FRONTEND_URL: http://localhost
      DB_USER: postgres
      DB_HOST: postgres
      DB_NAME: finwise
      DB_PASSWORD: 123
      DB_PORT: 5432
      JWT_SECRET: your-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped

  # Frontend instance 1
  frontend-1:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_expense_tracker_app-frontend-1
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api
    depends_on:
      - backend-1
      - backend-2
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped

  # Frontend instance 2
  frontend-2:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_expense_tracker_app-frontend-2
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api
    depends_on:
      - backend-1
      - backend-2
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped

  # Nginx load balancer
  nginx:
    image: nginx:alpine
    container_name: ai_expense_tracker_app-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend-1
      - frontend-2
      - backend-1
      - backend-2
    restart: unless-stopped

volumes:
  postgres_data: